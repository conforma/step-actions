---
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: create-test-result-attestation
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.56.0"
    tekton.dev/tags: "attestation, signing, in-toto, conforma"
spec:
  description: >-
    Creates and pushes an in-toto test-result attestation to a container
    registry using cosign. Signs with a cosign key from the parent Task's
    workspace. Outputs a JSON artifact reference for Tekton Chains to include
    in SLSA provenance.
  params:
    - name: image-url
      type: string
      description: Image URL without digest (e.g. quay.io/org/image)
    - name: image-digest
      type: string
      description: Image digest (sha256:...)
    - name: test-name
      type: string
      description: Name of the test (e.g. integration-test, clair-scan)
    - name: test-output
      type: string
      description: JSON test results to include in the attestation predicate
    - name: cosign-key-path
      type: string
      description: Path to the cosign private key file for signing
    - name: predicate-type
      type: string
      description: In-toto predicate type URI
      default: "https://in-toto.io/attestation/test-result/v0.1"
    - name: upload-tlog
      type: string
      description: Upload to Sigstore transparency log ("true" or "false")
      default: "false"
  results:
    - name: TEST_OUTPUT_ARTIFACT_OUTPUTS
      description: >-
        JSON object with "uri" and "digest" fields referencing the pushed
        attestation. Tekton Chains uses this to include the attestation in
        SLSA provenance.
  image: quay.io/conforma/attest-test-result:0.1
  env:
    - name: IMAGE_URL
      value: $(params.image-url)
    - name: IMAGE_DIGEST
      value: $(params.image-digest)
    - name: TEST_NAME
      value: $(params.test-name)
    - name: TEST_OUTPUT
      value: $(params.test-output)
    - name: COSIGN_KEY_PATH
      value: $(params.cosign-key-path)
    - name: PREDICATE_TYPE
      value: $(params.predicate-type)
    - name: UPLOAD_TLOG
      value: $(params.upload-tlog)
  script: |
    #!/usr/bin/env bash
    set -euo pipefail

    RESULT_FILE="$(step.results.TEST_OUTPUT_ARTIFACT_OUTPUTS.path)"

    # Write empty results on any error
    write_empty_results() {
      echo -n '{"uri":"","digest":""}' > "${RESULT_FILE}"
    }
    trap write_empty_results ERR

    # Validate cosign key is available
    if [ -z "${COSIGN_KEY_PATH:-}" ] || [ ! -f "${COSIGN_KEY_PATH}" ]; then
      echo "ERROR: Cosign key not found. COSIGN_KEY_PATH='${COSIGN_KEY_PATH:-}'"
      echo "The parent Task must mount a cosign-keys workspace and pass the path via the cosign-key-path param."
      write_empty_results
      exit 1
    fi

    IMAGE_REF="${IMAGE_URL}@${IMAGE_DIGEST}"
    TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

    # Build the predicate JSON with explicit fields from test output
    PREDICATE_FILE=$(mktemp)
    jq -n \
      --arg result "$(echo "${TEST_OUTPUT}" | jq -r '.result // "UNKNOWN"')" \
      --arg timestamp "${TIMESTAMP}" \
      --arg test_name "${TEST_NAME}" \
      --argjson successes "$(echo "${TEST_OUTPUT}" | jq '.successes // 0')" \
      --argjson failures "$(echo "${TEST_OUTPUT}" | jq '.failures // 0')" \
      --argjson warnings "$(echo "${TEST_OUTPUT}" | jq '.warnings // 0')" \
      --argjson test_output "${TEST_OUTPUT}" \
      '{
        result: $result,
        timestamp: $timestamp,
        configuration: [{name: $test_name}],
        successes: $successes,
        failures: $failures,
        warnings: $warnings,
        output: $test_output
      }' > "${PREDICATE_FILE}"

    echo "=== Creating Test Result Attestation ==="
    echo "Image:          ${IMAGE_REF}"
    echo "Test:           ${TEST_NAME}"
    echo "Predicate Type: ${PREDICATE_TYPE}"
    echo "Upload TLog:    ${UPLOAD_TLOG}"
    echo ""
    echo "Predicate:"
    jq '.' "${PREDICATE_FILE}"
    echo ""

    # Build cosign attest arguments
    COSIGN_ARGS=(
      attest -y
      --type "${PREDICATE_TYPE}"
      --predicate "${PREDICATE_FILE}"
      --key "${COSIGN_KEY_PATH}"
    )

    # Transparency log
    if [ "${UPLOAD_TLOG}" = "true" ]; then
      if [ -n "${REKOR_URL:-}" ]; then
        COSIGN_ARGS+=(--rekor-url "${REKOR_URL}")
      fi
    else
      COSIGN_ARGS+=(--tlog-upload=false)
    fi

    COSIGN_ARGS+=("${IMAGE_REF}")

    echo "=== Pushing Attestation ==="
    echo "Signing mode: key-based (${COSIGN_KEY_PATH})"
    cosign "${COSIGN_ARGS[@]}"
    echo ""

    # Discover the attestation digest
    echo "=== Discovering Attestation Digest ==="

    # Try OCI referrers API first (works with OCI 1.1 registries)
    ATTESTATION_DIGEST=$(oras discover "${IMAGE_REF}" \
      --artifact-type "application/vnd.dev.cosign.artifact.sig.v1+json" \
      --format json 2>/dev/null \
      | jq -r '.manifests[0].digest // empty' || true)

    if [ -z "${ATTESTATION_DIGEST}" ]; then
      ATTESTATION_DIGEST=$(oras discover "${IMAGE_REF}" \
        --format json 2>/dev/null \
        | jq -r '.manifests[0].digest // empty' || true)
    fi

    # Fallback: cosign tag-based scheme (.att tag)
    if [ -z "${ATTESTATION_DIGEST}" ]; then
      echo "OCI referrers API returned no results, trying tag-based discovery..."
      ATTESTATION_DIGEST=$(cosign tree "${IMAGE_REF}" 2>/dev/null \
        | grep -oP 'sha256:[a-f0-9]{64}' | tail -1 || true)
    fi

    if [ -z "${ATTESTATION_DIGEST}" ]; then
      echo "ERROR: Could not discover attestation digest from registry"
      write_empty_results
      exit 1
    fi

    echo "Attestation URL:    ${IMAGE_URL}"
    echo "Attestation Digest: ${ATTESTATION_DIGEST}"

    # Write the single JSON result
    jq -n \
      --arg uri "${IMAGE_URL}" \
      --arg digest "${ATTESTATION_DIGEST}" \
      '{"uri": $uri, "digest": $digest}' > "${RESULT_FILE}"

    echo ""
    echo "=== Attestation Complete ==="
    rm -f "${PREDICATE_FILE}"
